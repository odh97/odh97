<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="lang-title lang-desc">
  <title id="lang-title">odh97 languages</title>
  <desc id="lang-desc">{{desc}}</desc>
  <rect width="960" height="190" fill="#0E1230"/>
  <rect x="20" y="12" width="920" height="166" fill="#141A3F"/>
  <g fill="#B6A6FF"><rect x="20" y="8" width="920" height="4"/><rect x="20" y="178" width="920" height="4"/><rect x="16" y="12" width="4" height="166"/><rect x="940" y="12" width="4" height="166"/></g>
  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="44" y="44" font-size="13" font-weight="700" fill="#5CD6F2">$</text>
    <text x="60" y="44" font-size="13" font-weight="700" fill="#F4F1FF">cat languages.txt</text>
    <text x="916" y="44" text-anchor="end" font-size="11" font-weight="500" fill="#8E93C9">PUBLIC REPOS · BY BYTES</text>
  </g>
  <!-- 막대: x44 폭 872, 언어별 구간 -->
  <g shape-rendering="crispEdges">{{bar}}</g>
  <!-- 목록: 3열 × 2줄 (x 44 / 340 / 636, y 112 / 142) -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500">{{items}}</g>
  <style id="embedded-fonts" data-families="JetBrains+Mono:wght@500;700"></style>
</svg>
