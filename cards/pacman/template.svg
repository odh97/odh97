<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="contrib-title contrib-desc">
  <title id="contrib-title">odh97 contributions</title>
  <desc id="contrib-desc">{{desc}}</desc>
  <rect width="960" height="290" fill="#0E1230"/>
  <rect x="20" y="12" width="920" height="266" fill="#141A3F"/>
