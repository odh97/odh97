    </g>

    <!-- 명령 줄 -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600">
      <text x="24" y="26" fill="#5CD6F2">$</text>
      <text x="40" y="26" fill="#F4F1FF">git log --graph</text>
    </g>

    <!-- 잔디(창문) 애니메이션: style.mjs가 업스트림 그래프를 넣습니다 -->
    <svg data-pacman-graph="true" x="36" y="56" width="848" height="{{graphDisplayHeight}}" viewBox="-2 -2 {{graphWidth}} {{graphHeight}}" preserveAspectRatio="xMidYMid meet">{{graph}}</svg>
  </g>

  <!-- 아래는 생성되는 글꼴 데이터입니다. 읽거나 직접 수정하지 말고 node cards/embed.mjs cards/pacman/template.svg로 다시 넣으세요. -->
  <style id="embedded-fonts" data-families="JetBrains+Mono:wght@600">@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); unicode-range: U+20, U+24, U+2d, U+61, U+67-69, U+6c, U+6f-70, U+72, U+74; }</style>
</svg>
