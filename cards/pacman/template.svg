<svg xmlns="http://www.w3.org/2000/svg" width="960" height="{{height}}" viewBox="0 0 960 {{height}}" role="img" aria-labelledby="pacman-title pacman-desc">
  <title id="pacman-title">Pac-Man Contribution Arcade</title>
  <desc id="pacman-desc">{{desc}}</desc>
  <defs>
    <linearGradient id="pacman-panel" x2="0" y2="1">
      <stop stop-color="#242D47"/><stop offset="1" stop-color="#1B2339"/>
    </linearGradient>
    <linearGradient id="pacman-accent">
      <stop stop-color="#9786EC"/><stop offset="1" stop-color="#BDEDDD"/>
    </linearGradient>
  </defs>
  <rect width="960" height="{{height}}" rx="16" fill="#111526"/>
  <rect x="16" y="8" width="928" height="{{panelHeight}}" rx="7" fill="url(#pacman-panel)" stroke="#9786EC" stroke-width="2"/>
  <rect x="34" y="28" width="44" height="44" rx="12" fill="#383647" stroke="#61536B"/>
  <path d="M65 41A13 13 0 1 0 65 59L56 50Z" fill="#F4D77D"/>
  <circle cx="68" cy="50" r="2" fill="#F4D77D"/>
  <g font-family="Arial,sans-serif">
    <text x="92" y="48" font-size="24" font-weight="700" letter-spacing="1" fill="#F2EFFC">PAC-MAN</text>
    <text x="93" y="67" font-size="10" letter-spacing="2.2" fill="#BEB2F3">CONTRIBUTION ARCADE</text>
    <rect x="806" y="36" width="120" height="28" rx="14" fill="#29354A" stroke="#425369"/>
    <circle cx="823" cy="50" r="3" fill="#BDEDDD"/>
    <text x="837" y="54" font-size="10" letter-spacing="1.2" fill="#BDEDDD">AUTO PLAY</text>
  </g>
  <rect x="34" y="94" width="892" height="{{boardHeight}}" rx="10" fill="#151C30" stroke="#3D4664"/>
  <rect x="48" y="94" width="88" height="2" rx="1" fill="url(#pacman-accent)"/>
  <svg data-pacman-graph="true" x="46" y="112" width="868" height="{{graphDisplayHeight}}" viewBox="-2 -2 {{graphWidth}} {{graphHeight}}" preserveAspectRatio="xMidYMid meet">{{graph}}</svg>
  <!-- Everything after the nested SVG is presentation, not game content. -->
  <g font-family="Arial,sans-serif" font-size="10" fill="#ADB9DA">
    <text x="34" y="{{legendTextY}}" letter-spacing="1">{{caption}}</text>
    <text x="748" y="{{legendTextY}}">LESS</text>
    <rect x="782" y="{{legendRectY}}" width="14" height="14" rx="3" fill="#28324D"/><rect x="802" y="{{legendRectY}}" width="14" height="14" rx="3" fill="#514477"/><rect x="822" y="{{legendRectY}}" width="14" height="14" rx="3" fill="#7560A8"/><rect x="842" y="{{legendRectY}}" width="14" height="14" rx="3" fill="#9786EC"/><rect x="862" y="{{legendRectY}}" width="14" height="14" rx="3" fill="#C7B8FF"/>
    <text x="896" y="{{legendTextY}}">MORE</text>
  </g>
</svg>
