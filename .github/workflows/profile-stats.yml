name: Update profile stats

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - cards/stats/update.mjs
      - cards/stats/template.svg
      - cards/stats/update.test.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test stats collection and rendering
        run: node --test cards/stats/update.test.mjs
      - name: Fetch public GitHub statistics
        run: node cards/stats/update.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated card
        run: |
          if [ -n "$(git status --porcelain -- cards/stats/stats.svg)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cards/stats/stats.svg
            git commit -m 'Update profile statistics'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
