name: Update extra cards

on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/extra-cards.yml
      - cards/github.mjs
      - cards/embed.mjs
      - cards/extras.test.mjs
      - cards/languages/template.svg
      - cards/languages/update.mjs
      - cards/streak/template.svg
      - cards/streak/update.mjs
      - cards/activity/template.svg
      - cards/activity/update.mjs

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test card logic
        run: node --test cards/extras.test.mjs
      - name: Build cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node cards/languages/update.mjs
          node cards/streak/update.mjs
          node cards/activity/update.mjs
      - name: Embed fonts
        # 글꼴을 못 받아도 카드는 시스템 글꼴로 표시되므로 실패해도 계속합니다.
        run: node cards/embed.mjs cards/languages/languages.svg cards/streak/streak.svg cards/activity/activity.svg || echo "font embed skipped"
      - name: Commit cards
        run: |
          files="cards/languages/languages.svg cards/streak/streak.svg cards/activity/activity.svg"
          if [ -n "$(git status --porcelain -- $files)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $files
            git commit -m 'Update extra cards'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
