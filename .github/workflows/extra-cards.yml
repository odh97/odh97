name: Update cafe card

on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/extra-cards.yml
      - cards/github.mjs
      - cards/embed.mjs
      - cards/tmux/*.mjs
      - cards/tmux/template.svg

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test card logic
        run: node --test cards/tmux/update.test.mjs
      - name: Build cafe card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cards/tmux/update.mjs
      - name: Embed fonts
        # 글꼴을 못 받아도 카드는 시스템 글꼴로 표시되므로 실패해도 계속합니다.
        run: node cards/embed.mjs cards/tmux/tmux.svg || echo "font embed skipped"
      - name: Commit card
        run: |
          if [ -n "$(git status --porcelain -- cards/tmux/tmux.svg)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cards/tmux/tmux.svg
            git commit -m 'Update cafe card'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
